name: System & Security Radar Engine

on:
  schedule:
    # Runs every 4 hours: 02:00, 06:00, 10:00, 14:00, 18:00, 22:00 UTC
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      generate_digest:
        description: "Force generate daily markdown digest post"
        type: boolean
        default: false

concurrency:
  group: radar-sync
  cancel-in-progress: false

jobs:
  radar-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Execute Radar Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Pass --digest at 18:00 or 22:00 UTC (night in TR) or when manually requested
          CURRENT_HOUR=$(date -u +%H)
          if [ "${{ github.event.inputs.generate_digest }}" = "true" ] || [ "$CURRENT_HOUR" = "18" ] || [ "$CURRENT_HOUR" = "22" ]; then
            echo "[*] Running with --digest enabled"
            python scripts/radar.py --digest
          else
            echo "[*] Running standard rolling window sync"
            python scripts/radar.py
          fi

      - name: Commit and Push Updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar.json content/posts/radar/
          
          if ! git diff --staged --quiet; then
            echo "[*] Changes detected, committing..."
            git commit -m "chore(radar): sync telemetry and daily digest [skip ci]"
            git push origin main
            
            echo "[*] Triggering Hugo Pages deployment..."
            gh workflow run hugo.yml || echo "[!] Notice: Hugo deploy dispatch skipped or not needed"
          else
            echo "[*] No new feed changes to commit."
          fi
