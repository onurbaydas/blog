baseURL = 'https://onurbaydas.online/'
locale = 'tr-tr'
title = 'Onur Baydaş'
theme = 'PaperMod'
defaultContentLanguage = 'tr'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[languages]
  [languages.tr]
    languageName = 'Türkçe'
    locale = 'tr-tr'
    weight = 1
    [[languages.tr.menus.main]]
      name = 'Yazılar'
      pageRef = '/posts'
      weight = 10
    [[languages.tr.menus.main]]
      name = 'Etiketler'
      pageRef = '/tags'
      weight = 20
    [[languages.tr.menus.main]]
      name = 'Ara'
      pageRef = '/search'
      weight = 30
    [[languages.tr.menus.main]]
      name = 'Hakkımda'
      pageRef = '/about'
      weight = 40
  [languages.en]
    languageName = 'English'
    locale = 'en-us'
    weight = 2
    title = 'Onur Baydaş'
    [languages.en.params]
      description = 'Technical writing'
      [languages.en.params.homeInfoParams]
        Title = 'OB'
        Content = 'Technical writing.'
    [[languages.en.menus.main]]
      name = 'Posts'
      pageRef = '/posts'
      weight = 10
    [[languages.en.menus.main]]
      name = 'Tags'
      pageRef = '/tags'
      weight = 20
    [[languages.en.menus.main]]
      name = 'Search'
      pageRef = '/search'
      weight = 30
    [[languages.en.menus.main]]
      name = 'About'
      pageRef = '/about'
      weight = 40

[params]
  author = 'Onur Baydaş'
  description = 'Teknik yazılar'
  defaultTheme = 'dark'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = true
  ShareButtons = ['linkedin', 'x']
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
  [params.homeInfoParams]
    Title = 'OB'
    Content = 'Teknik yazılar.'
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/onurbaydas'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.highlight]
    noClasses = false
