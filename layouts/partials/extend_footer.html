{{- if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    theme: "default",
    sequence: { useMaxWidth: false },
    flowchart: { useMaxWidth: false }
  });
</script>
{{- end }}
