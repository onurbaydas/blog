<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">

{{- /* Google Fonts: Swiss Punk, Terminal, Industrial, Glitch, Brutalist */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800;900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Rubik+Glitch&family=Space+Grotesk:wght@600;700;900&family=Syne:wght@700;800;900&family=VT323&display=swap" rel="stylesheet">

{{- /* Head extension: mermaid diagram support */ -}}
{{- if and .IsPage (strings.Contains (string .Content) "class=\"mermaid\"") }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    theme: "dark",
    sequence: { useMaxWidth: false },
    flowchart: { useMaxWidth: false }
  });
</script>
{{- end }}
